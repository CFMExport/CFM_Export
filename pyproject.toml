[project]
name = "cfm-exporter"
version = "2.0.0"
description = "Madden CFM export listener + EA pull exporter, multi-league, Firebase RTDB"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "firebase-admin>=6.5",
    "httpx>=0.27",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
